name: Publish CV PDF

on:
  push:
    branches:
      - main
    paths:
      - "CV.pdf"
      - ".github/workflows/publish-cv.yml"

  # Allows the workflow to be started manually from the Actions tab.
  workflow_dispatch:

# Minimum permissions needed for GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent simultaneous Pages deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out private repository
        uses: actions/checkout@v7

      - name: Prepare public files
        run: |
          mkdir -p _site

          # Publish only the compiled PDF.
          cp CV.pdf _site/CV.pdf

          # Make the root Pages address redirect directly to the PDF.
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=CV.pdf">
            <title>David Li — Curriculum Vitae</title>
          </head>
          <body>
            <p><a href="CV.pdf">Open David Li's CV</a></p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload public Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
